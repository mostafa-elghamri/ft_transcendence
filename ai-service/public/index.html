<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Splitwise AI - المساعد الذكي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --glass-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --accent-primary: #3b82f6;
      --accent-secondary: #8b5cf6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --user-bubble: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      --bot-bubble: rgba(51, 65, 85, 0.5);
      --source-bg: rgba(16, 185, 129, 0.1);
      --source-text: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 680px;
      height: 85vh;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      padding: 20px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.5);
    }

    .header-info h2 {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .token-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 8px 14px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.85rem;
      width: 120px;
      transition: all 0.3s ease;
    }

    .token-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    /* Chat Log */
    #log {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-primary) transparent;
    }

    #log::-webkit-scrollbar {
      width: 6px;
    }
    #log::-webkit-scrollbar-thumb {
      background: var(--accent-primary);
      border-radius: 10px;
    }

    /* Messages */
    .message-wrapper {
      display: flex;
      gap: 12px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .avatar.user {
      background: var(--user-bubble);
    }
    .avatar.bot {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    .message-content {
      max-width: 75%;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.6;
      position: relative;
    }

    .msg-user .bubble {
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg-bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--glass-border);
      border-bottom-left-radius: 4px;
    }

    .msg-sources {
      margin-top: 8px;
      background: var(--source-bg);
      color: var(--source-text);
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    /* Typing Indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 6px 0;
    }
    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* Input Area */
    .input-area {
      padding: 20px;
      border-top: 1px solid var(--glass-border);
      background: rgba(15, 23, 42, 0.5);
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 8px;
      transition: all 0.3s ease;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    #question {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
      padding: 10px;
      resize: none;
      max-height: 120px;
      outline: none;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      background: var(--accent-primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      background: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.1);
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .chat-container { height: 100vh; border-radius: 0; }
      .message-content { max-width: 85%; }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
      <div class="header-info">
        <h2>✨ Splitwise AI</h2>
        <p>مساعدك المالي الذكي</p>
      </div>
      <input id="token" class="token-input" placeholder="توكن JWT" />
    </div>

    <!-- Chat Log -->
    <div id="log">
      <div class="message-wrapper msg-bot">
        <div class="avatar bot">🤖</div>
        <div class="message-content">
          <div class="bubble">مرحباً! كيف يمكنني مساعدتك في حساباتك اليوم؟</div>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="question" rows="1" placeholder="مثال: كم أدين إجمالاً؟" oninput="autoResize(this)"></textarea>
        <div class="btn-group">
          <button class="secondary" onclick="send(true)">إرسال</button>
          <!-- <button onclick="send(false)">إرسال 🚀</button> -->
        </div>
      </div>
    </div>
  </div>

  <script>
    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    function valueOrDefault(value, fallback) {
      if (value !== undefined && value !== null && value !== '') {
        return value;
      } else {
        return fallback;
      }
    }

    function appendUser(q) {
      const log = document.getElementById('log');
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper msg-user';
      wrapper.innerHTML = `
        <div class="avatar user">🧑</div>
        <div class="message-content">
          <div class="bubble">${q}</div>
        </div>
      `;
      log.appendChild(wrapper);
      log.scrollTop = log.scrollHeight;
    }

    function appendBotWrapper() {
      const log = document.getElementById('log');
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper msg-bot';
      wrapper.innerHTML = `
        <div class="avatar bot">🤖</div>
        <div class="message-content">
          <div class="bubble">
            <div class="typing-indicator">
              <span></span><span></span><span></span>
            </div>
          </div>
        </div>
      `;
      log.appendChild(wrapper);
      log.scrollTop = log.scrollHeight;
      return wrapper.querySelector('.bubble');
    }

    async function send(streaming) {
      const question = document.getElementById('question').value.trim();
      const token = document.getElementById('token').value.trim();
      const log = document.getElementById('log');

      if (!question) return;

      appendUser(question);
      document.getElementById('question').value = '';
      document.getElementById('question').style.height = 'auto';

      const headers = { 'Content-Type': 'application/json' };
      if (token) {
        headers['Authorization'] = `Bearer ${token}`;
      }

      if (!streaming) {
        const botBubble = appendBotWrapper();
        
        try {
          const res = await fetch('/api/chat', { method: 'POST', headers, body: JSON.stringify({ question }) });
          const data = await res.json();

          botBubble.innerHTML = valueOrDefault(data.answer, data.error || 'حدث خطأ غير معروف');

          if (data.sources && data.sources.length > 0) {
            const srcHtml = `<div class="msg-sources">📎 المصادر: ${data.sources.length} مقطع مستخدم</div>`;
            botBubble.insertAdjacentHTML('afterend', srcHtml);
          }
        } catch (e) {
          botBubble.innerHTML = `خطأ في الاتصال: ${e.message}`;
        }
        log.scrollTop = log.scrollHeight;
        return;
      }

      // Streaming Mode
      const botBubble = appendBotWrapper();
      botBubble.textContent = ''; // Clear typing indicator

      try {
        const res = await fetch('/api/chat/stream', { method: 'POST', headers, body: JSON.stringify({ question }) });

        if (!res.ok) {
          const errData = await res.json();
          botBubble.textContent = valueOrDefault(errData.error, 'فشل الاتصال بالسيرفر.');
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const events = buffer.split('\n\n');
          buffer = events.pop();

          for (const evt of events) {
            const lines = evt.split('\n');

            const eventLine = lines.find((l) => l.startsWith('event:'));
            let eventType = eventLine ? eventLine.slice(6).trim() : null;

            const dataLine = lines.find((l) => l.startsWith('data:'));
            if (!dataLine) continue;

            const data = JSON.parse(dataLine.slice(5).trim());

            if (eventType === 'token') {
              botBubble.textContent += data.text;
            } else if (eventType === 'sources') {
              if (data.sources && data.sources.length > 0) {
                const srcHtml = `<div class="msg-sources">📎 المصادر: ${data.sources.length} مقطع مستخدم</div>`;
                if (!botBubble.dataset.sourcesAdded) {
                  botBubble.insertAdjacentHTML('afterend', srcHtml);
                  botBubble.dataset.sourcesAdded = 'true';
                }
              }
            } else if (eventType === 'error') {
              botBubble.textContent += ' [خطأ: ' + data.message + ']';
            }
          }
          log.scrollTop = log.scrollHeight;
        }
      } catch (e) {
        botBubble.textContent += ' [خطأ: ' + e.message + ']';
      }
    }
  </script>
</body>
</html>
